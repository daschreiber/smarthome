# HomeKit cover workaround — see docs/APPLE_HOME_SETUP.md
#
# The Control4 cover entities claim position support, but position commands
# (cover.set_cover_position) are silently dropped by the Control4->KNX chain
# and position feedback is stuck near 1%. Apple Home drives covers by target
# position, so raising blinds from the Home app does nothing, while the
# open/close/stop services work (proven by the PWA and runbook Stage 3).
#
# Modern `template:` format (the legacy `cover: - platform: template` block
# loads but never sets up on current HA — attempt 1, 2026-07-21). With no
# `state`/`position` template these covers are optimistic: state follows the
# last command instead of the broken feedback. Only open/close/stop are
# offered, so HomeKit renders plain up/down controls.
#
# Install: copy this block into configuration.yaml on the Green, validate,
# restart. Then exclude the 13 original cover.* Control4 entities from the
# HomeKit Bridge; these HK wrappers join the bridge automatically.

template:
  - cover:
      - name: "HK Daniel Study Blinds"
        unique_id: hk_daniel_study_blinds
        open_cover:
          - action: cover.open_cover
            target:
              entity_id: cover.daniel_s_study_daniel_study_blinds
        close_cover:
          - action: cover.close_cover
            target:
              entity_id: cover.daniel_s_study_daniel_study_blinds
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id: cover.daniel_s_study_daniel_study_blinds
