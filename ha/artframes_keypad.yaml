# Picture Frames follow Night and Morning pressed anywhere but the app:
# the wall keypad, Alexa, Siri / Apple Home, the Home Assistant dashboard.
#
# Paste this block into /config/configuration.yaml on the Green (File editor
# add-on) after filling in the values under `variables:` and the addresses
# under `knx: event:`. See ha/README.md for the capture walk.
#
# Why: the app's Frame follower (web/src/lib/artframes.ts) darkens the five
# picture Frames on a Night press and lights them on a Morning press — but
# it can only see presses that go THROUGH the app (a card tap, an automation
# step). The owner presses the button on the wall; the household also says
# it to Alexa or Siri. The scene switch's HA state never changes (it has
# read `on` since 09-03), so the app cannot read a "mode" — only a press
# can be caught, and there are two roads a press takes without the app:
#
#   1. The wall keypad: a KNX telegram on the scene group address. Control4
#      acts on it; Home Assistant's own KNX tunnel sees native keypad
#      telegrams too (knx/README.md — its blind spot is Control4-ORIGINATED
#      traffic). Told to report the scene address, HA fires a `knx_event`.
#   2. Alexa, Siri / Apple Home, the HA dashboard: each calls
#      `light.turn_on` on the switch through HA's service bus, which fires a
#      `call_service` event. So does the app's own press — the app drops a
#      repeat of the same press inside 10 s, so that echo does nothing
#      (Activity shows it as `frames_duplicate`).
#
# One automation catches both and relays the press to the app, which runs
# the same follower it runs for its own buttons: same Frame list, same
# "leave a set that is being watched alone", same wake path for the sets
# that ignore a magic packet.
#
# What the app needs from HA: one POST per press,
#   POST https://<app>/api/artframes   x-hook-key: <HA_HOOK_KEY>
#   {"press": "night" | "morning", "source": "<who>"}
# HA_HOOK_KEY is a Railway variable on the app (docs/DEPLOY_RAILWAY.md); the
# same string goes into /config/secrets.yaml as `smarthome_hook_key`. It is
# deliberately NOT the app's APP_KEY: this key buys one thing only — a Night
# or Morning sweep of the Frames — so a copy of this file is not a copy of
# the house's keys.
#
# ---------------------------------------------------------------------------
# FILL IN:
#
# The keypad (capture walk, ~2 minutes):
#   HA → Settings → Devices & services → KNX → the KNX panel → Group monitor.
#   Press Night on the wall keypad. The new row's "Destination" is the
#   Night group address; "Source" is the keypad (1.1.x); "Payload"/"Value"
#   is what it wrote. Press Morning; read the same three. Two shapes are
#   common and both work here:
#     - two 1-bit addresses (one per button, value 1 / "On"):
#         night_ga "2/0/5" night_value 1, morning_ga "2/0/6" morning_value 1
#     - ONE scene address, one byte, scene number per button:
#         night_ga == morning_ga, night_value [3], morning_value [2]
#       (a byte payload shows as one number in the monitor, possibly in hex
#       — 0x03 is 3; write it here as a one-item list. A 1-bit payload is a
#       bare 0 or 1.)
#
# The service road needs nothing captured. Optional: the app's own HA user
# id in `app_user_id` (Settings → People → Users → smarthome-app → ID)
# stops HA relaying the app's own presses at all; left blank, they are
# relayed and the app answers "duplicate" — harmless, one line in Activity.
#
# Then: Developer tools → YAML → Check configuration → reload KNX, REST
# commands AND Automations (all three; the rest_command is loaded by none
# of the others — or restart once). Test: press Night on the wall, and in the app's
# Activity look for `system:artframes` `frames_turn_off` with user
# `ha:1.1.x`; say "Alexa, turn on night mode" and look for user
# `ha:voice-or-ui`. HA's own Settings → Automations → traces show each
# press arriving even before the app is reached.
# ---------------------------------------------------------------------------

knx:
  # Which group addresses HA turns into `knx_event`s. Only these are
  # needed; wildcards are possible but every listed telegram costs an event.
  # One line per DIFFERENT address in the `buttons:` table below.
  event:
    - address:
        - "0/0/0"   # ← Night
        - "0/0/0"   # ← Morning
        - "0/0/0"   # ← door keypad: Lights 6
        - "0/0/0"   # ← door keypad: Lights 5
        - "0/0/0"   # ← door keypad: Exit
        - "0/0/0"   # ← Exit floor 5 (this house: 0/0/2, keypad 1.1.43 writes 0)

# Frames back to art after a wake (frame_art.py, 2026-09-20). No template, so
# no shell and no input. Merge into an existing `shell_command:` key; reload
# "Shell commands" (or shell_command.reload) after adding.
shell_command:
  frame_art_lounge: 'python3 /config/frame_art.py "Lounge TV"'
  frame_art_lounge_check: 'python3 /config/frame_art.py "Lounge TV" --check'
  frame_art_dining_left: 'python3 /config/frame_art.py "Left 32"'
  frame_art_dining_middle: 'python3 /config/frame_art.py "Middle 32"'
  frame_art_dining_right: 'python3 /config/frame_art.py "Right 32"'
  frame_art_dining_check: 'python3 /config/frame_art.py "Left 32" --check'
  frame_art_den: 'python3 /config/frame_art.py "Den TV"'
  frame_art_den_check: 'python3 /config/frame_art.py "Den TV" --check'

rest_command:
  # The relay to the app. `payload` is rendered by HA and sent as JSON —
  # a template here is safe (it becomes an HTTP body, never a shell
  # command; cf. the shell_command warning in c4_recovery.yaml).
  smarthome_frames_press:
    url: "https://<the app's Railway host>/api/artframes"   # ← APP_BASE_URL, docs/DEPLOY_RAILWAY.md
    method: POST
    headers:
      x-hook-key: !secret smarthome_hook_key
    content_type: "application/json; charset=utf-8"
    # floor: null = every Frame; spare: false = darken a watched set too.
    payload: >-
      {{ {"press": press, "source": source, "floor": floor | default(none), "spare": spare | default(true)} | to_json }}
    # A Frame's held power key takes ~8 s, but the app answers 202 as soon as
    # the sweep is started, so this is only for a slow cold start on Railway.
    timeout: 15

automation manual_artframes_keypad:
  - id: artframes_wall_keypad
    alias: "Picture Frames: follow Night and Morning from the wall, Alexa, Siri, HA"
    description: >-
      A Night, Morning, Exit or floor-lights press that did not go through
      the smarthome app — a KNX keypad telegram (knx_event), or a
      light.turn_on on a scene switch from Alexa, Siri / Apple Home or the
      HA dashboard (call_service) — is relayed to the app, whose Frame
      follower turns the picture Frames off or on exactly as it does for a
      press in the app. ha/artframes_keypad.yaml.
    # Two presses in quick succession run in order rather than the second
    # cancelling the first; the app itself drops a repeat within 10 s.
    mode: queued
    max: 4
    variables:
      # --- the keypads (capture walk in the header) ---------------------
      # One row per button AND payload: `ga` the Destination, `value` what
      # it wrote (1-bit: a bare 0 or 1; a scene byte: [n]), `press` what the
      # Frames do (night = off, morning = on). `floor` limits the press to
      # that floor's Frames (6: Dining x3 + Lounge TV; 5: Den TV); `spare:
      # false` darkens a set even if its sensor says it is being watched —
      # the door buttons are pressed on the way out. A toggle button is two
      # rows, one per value it writes.
      buttons:
        - { ga: "0/0/0", value: 1, press: night }                            # ← Night
        - { ga: "0/0/0", value: 1, press: morning }                          # ← Morning
        - { ga: "0/0/0", value: 0, press: night, floor: 6, spare: false }    # ← door: Lights 6 off
        - { ga: "0/0/0", value: 1, press: morning, floor: 6, spare: false }  # ← door: Lights 6 on
        - { ga: "0/0/0", value: 0, press: night, floor: 5, spare: false }    # ← door: Lights 5 off
        - { ga: "0/0/0", value: 1, press: morning, floor: 5, spare: false }  # ← door: Lights 5 on
        - { ga: "0/0/0", value: 1, press: night, spare: false }              # ← door: Exit (whole house)
        - { ga: "0/0/0", value: 1, press: night, floor: 5, spare: false }    # ← Exit floor 5 (not a toggle; Den TV off)
      # --- the service road (nothing to capture) ------------------------
      # Alexa, Siri / Apple Home, the dashboard — and the app's own press,
      # which the app then drops as a repeat.
      switches:
        light.knx_switch_all_house_night: { press: night }
        light.knx_switch_all_house_morning: { press: morning }
        light.knx_switch_all_house_exit: { press: night, spare: false }
      app_user_id: ""        # ← optional: the smarthome-app HA user's id, to skip its own presses
      # The table row this trigger matches, or {} when it is none of ours.
      # Rendered per trigger (HA renders automation variables at trigger
      # time, in order). A KNX byte payload arrives as a TUPLE, which never
      # equals a YAML list in a template — hence the `| list`. A service
      # call's entity_id may be one string or a list.
      hit: >-
        {%- if trigger.id == 'keypad' -%}
          {%- set d = trigger.event.data.data -%}
          {%- set p = d if d is number else (d | list) -%}
          {{ buttons | selectattr('ga', 'eq', trigger.event.data.destination)
                     | selectattr('value', 'eq', p) | list | first | default({}) }}
        {%- else -%}
          {%- set ids = trigger.event.data.service_data.entity_id | default([], true) -%}
          {%- set ids = [ids] if ids is string else ids -%}
          {%- set mine = app_user_id and trigger.event.context.user_id == app_user_id -%}
          {%- set id = ids | select('in', switches.keys() | list) | first | default('') -%}
          {{ switches[id] if id and not mine else {} }}
        {%- endif -%}
      press: "{{ hit.press | default('') }}"
      # Who pressed, for the app's audit line (`ha:<source>`): the keypad's
      # individual address (1.1.x), or `voice-or-ui` for a service call —
      # HA cannot tell Alexa from Siri from a dashboard tap.
      source: >-
        {{ trigger.event.data.source if trigger.id == 'keypad' else 'voice-or-ui' }}
    trigger:
      # 1. Every incoming write on the addresses listed under knx: event:.
      - platform: event
        event_type: knx_event
        event_data:
          direction: Incoming
          telegramtype: GroupValueWrite
        id: keypad
      # 2. Any turn_on on a light through HA's service bus — Alexa, Siri /
      #    Apple Home (the HomeKit bridge), the dashboard, an HA script, and
      #    the app itself. `hit` above keeps only the scene switches.
      - platform: event
        event_type: call_service
        event_data:
          domain: light
          service: turn_on
        id: service
      - platform: event
        event_type: call_service
        event_data:
          domain: homeassistant
          service: turn_on
        id: service
    condition:
      - condition: template
        value_template: "{{ press in ['night', 'morning'] }}"
    action:
      - service: rest_command.smarthome_frames_press
        data:
          press: "{{ press }}"
          source: "{{ source }}"
          floor: "{{ hit.floor | default(none) }}"
          spare: "{{ hit.spare | default(true) }}"
        # So the trace shows what the app answered: 202 accepted, 200
        # duplicate, 401 wrong key, 503 HA_HOOK_KEY not set.
        response_variable: answer
      # A Frame wakes into whatever it showed when it went off, and the app can
      # only say "on". After a Morning, ask each set it reached itself and put
      # it in art if it is not (frame_art.py; a set already in art is left
      # alone): the Lounge TV and the three Dining sets, on a whole-house
      # Morning or the door's Lights 6. Not the Den TV: no press switches it
      # on (owner, 2026-09-22, `art_frame_off_only` in the app's map), and
      # asking a standing-by set could wake it. Two passes, at 20 s and about
      # 45 s, because a set still waking answers "unreachable"; the second pass
      # costs nothing on a set the first one settled. The trace shows every answer.
      - if:
          - condition: template
            value_template: "{{ press == 'morning' and (hit.floor | default(6)) == 6 }}"
        then:
          - repeat:
              count: 2
              sequence:
                - delay: "00:00:20"
                - repeat:
                    for_each:
                      - frame_art_lounge
                      - frame_art_dining_left
                      - frame_art_dining_middle
                      - frame_art_dining_right
                    sequence:
                      - service: "shell_command.{{ repeat.item }}"
                        response_variable: art_answer
                        continue_on_error: true
