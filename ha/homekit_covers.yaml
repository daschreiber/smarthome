# HomeKit cover workaround — see docs/APPLE_HOME_SETUP.md
#
# The Control4 cover entities claim position support, but position commands
# (cover.set_cover_position) are silently dropped by the Control4->KNX chain
# and position feedback is stuck near 1%. Apple Home drives covers by target
# position, so raising blinds from the Home app does nothing, while the
# open/close/stop services work (proven by the PWA and runbook Stage 3).
#
# These template covers wrap each blind with ONLY open/close/stop and no
# value_template, making them optimistic (state = last command). Expose
# these to the HomeKit Bridge and exclude the cover.* Control4 originals.
#
# Install: copy this block into configuration.yaml on the Green (or include
# it as a package), validate config, restart Home Assistant.

cover:
  - platform: template
    covers:
      hk_daniel_study_blinds:
        unique_id: hk_daniel_study_blinds
        friendly_name: "HK Daniel Study Blinds"
        open_cover:
          action: cover.open_cover
          target: { entity_id: cover.daniel_s_study_daniel_study_blinds }
        close_cover:
          action: cover.close_cover
          target: { entity_id: cover.daniel_s_study_daniel_study_blinds }
        stop_cover:
          action: cover.stop_cover
          target: { entity_id: cover.daniel_s_study_daniel_study_blinds }
